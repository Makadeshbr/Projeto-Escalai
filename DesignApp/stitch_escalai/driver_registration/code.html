<!DOCTYPE html>
<html class="dark" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cadastro de Motorista</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ffe600", // Mercado Livre Yellow
                        "primary-dark": "#d9c400",
                        "background-light": "#f8f8f5",
                        "background-dark": "#1a1a1a", // Deep dark grey instead of brownish
                        "surface-dark": "#2a2a2a",
                        "mercado-blue": "#2d3277", 
                        "accent-blue": "#3483fa", // Mercado Livre Blue accent
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                    boxShadow: {
                        'glow': '0 0 15px rgba(255, 230, 0, 0.15)',
                        'glow-focus': '0 0 20px rgba(255, 230, 0, 0.3)',
                    }
                },
            },
        }
    </script>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
        .futuristic-input {
            background: rgba(45, 42, 29, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col items-center justify-center p-0 m-0 overflow-x-hidden selection:bg-primary selection:text-black">
<div class="relative w-full max-w-md mx-auto min-h-screen flex flex-col bg-background-light dark:bg-background-dark overflow-hidden">
<div class="absolute top-0 left-0 w-full h-96 bg-gradient-to-b from-mercado-blue/30 via-mercado-blue/5 to-transparent pointer-events-none z-0"></div>
<div class="absolute -right-24 top-0 w-80 h-80 bg-primary/5 rounded-full blur-[80px] pointer-events-none z-0"></div>
<div class="absolute -left-20 top-40 w-60 h-60 bg-accent-blue/10 rounded-full blur-[60px] pointer-events-none z-0"></div>
<div class="relative z-10 w-full p-6 pb-2 flex flex-col items-center pt-12">
<div class="w-24 h-24 rounded-3xl bg-gradient-to-br from-[#fff159] to-[#f2d005] flex items-center justify-center shadow-[0_0_25px_rgba(255,230,0,0.2)] mb-6 transform hover:scale-105 transition-transform duration-300 ring-4 ring-background-dark/50">
<span class="material-symbols-outlined text-background-dark text-5xl">local_shipping</span>
</div>
<h1 class="text-3xl font-bold tracking-tight text-center mb-2 bg-clip-text text-transparent bg-gradient-to-r from-slate-900 to-slate-600 dark:from-white dark:to-slate-400">Cadastro de Motorista</h1>
<p class="text-slate-500 dark:text-slate-400 text-center text-sm max-w-[280px] leading-relaxed">Conecte-se à rede logística e inicie sua rota de entregas com eficiência.</p>
</div>
<form class="relative z-10 flex-1 flex flex-col gap-6 p-6 mt-2 w-full">
<div class="flex flex-col gap-2 group">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1 group-focus-within:text-primary transition-colors flex items-center gap-2">
                    E-mail
                </label>
<div class="relative flex items-center">
<div class="absolute left-4 text-slate-400 group-focus-within:text-primary transition-colors z-20">
<span class="material-symbols-outlined text-[22px]">mail</span>
</div>
<input class="w-full bg-slate-100 dark:bg-surface-dark/80 border border-transparent dark:border-slate-700 rounded-xl py-4 pl-12 pr-4 text-base focus:ring-2 focus:ring-primary focus:border-transparent placeholder-slate-400 dark:placeholder-slate-500 transition-all shadow-sm focus:shadow-glow-focus text-slate-900 dark:text-white" placeholder="motorista@logistica.com" type="email"/>
</div>
</div>
<div class="flex flex-col gap-2 group">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1 group-focus-within:text-primary transition-colors">Senha</label>
<div class="relative flex items-center">
<div class="absolute left-4 text-slate-400 group-focus-within:text-primary transition-colors z-20">
<span class="material-symbols-outlined text-[22px]">lock</span>
</div>
<input class="w-full bg-slate-100 dark:bg-surface-dark/80 border border-transparent dark:border-slate-700 rounded-xl py-4 pl-12 pr-12 text-base focus:ring-2 focus:ring-primary focus:border-transparent placeholder-slate-400 dark:placeholder-slate-500 transition-all shadow-sm focus:shadow-glow-focus text-slate-900 dark:text-white" placeholder="••••••••" type="password"/>
<button class="absolute right-4 text-slate-400 hover:text-primary transition-colors z-20 focus:outline-none" type="button">
<span class="material-symbols-outlined text-[22px]">visibility_off</span>
</button>
</div>
</div>
<div class="flex flex-col gap-2 group">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1 group-focus-within:text-primary transition-colors flex justify-between items-end">
<span>Placa do Veículo</span>
<span class="text-[10px] text-accent-blue bg-accent-blue/10 px-2 py-0.5 rounded-full font-bold uppercase tracking-wider border border-accent-blue/20">Obrigatório</span>
</label>
<div class="relative flex items-center bg-slate-200 dark:bg-[#151515] border border-slate-300 dark:border-slate-700 rounded-xl overflow-hidden focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all p-1 shadow-inner">
<div class="h-12 w-12 bg-mercado-blue flex flex-col items-center justify-center rounded-lg shrink-0 shadow-lg relative overflow-hidden group-focus-within:shadow-[0_0_10px_rgba(45,50,119,0.5)] transition-shadow">
<div class="absolute top-0 left-0 w-full h-1/2 bg-white/10"></div>
<span class="material-symbols-outlined text-white text-lg drop-shadow-md">public</span>
<span class="text-[7px] font-bold text-white leading-none mt-0.5 tracking-wider">BRA</span>
</div>
<input class="flex-1 bg-transparent border-none py-3 px-4 text-xl font-mono font-bold tracking-[0.25em] uppercase text-center placeholder-slate-400 dark:placeholder-slate-700 focus:ring-0 text-slate-800 dark:text-white" placeholder="ABC1D23" type="text"/>
</div>
<p class="text-xs text-slate-500 dark:text-slate-500 ml-1 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">info</span>
                    Digite a placa sem espaços ou traços.
                </p>
</div>
<div class="mt-4"></div>
<button class="group relative w-full bg-primary text-[#2d2a1d] font-bold text-lg py-4 rounded-xl shadow-[0_4px_0_#d9c400] active:shadow-none active:translate-y-[4px] transition-all hover:bg-[#ffe600] overflow-hidden" type="button">
<span class="relative z-10 flex items-center justify-center gap-2">
                    Cadastrar
                    <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</span>
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/40 to-transparent -skew-x-12 -translate-x-full group-hover:animate-[shimmer_1s_infinite]"></div>
</button>
<div class="flex items-center justify-center gap-2 mt-4 pb-8">
<span class="text-sm text-slate-500 dark:text-slate-400">Já faz parte da frota?</span>
<a class="text-sm font-bold text-accent-blue hover:text-primary transition-colors hover:underline underline-offset-4 decoration-2" href="#">Fazer Login</a>
</div>
</form>
<div class="absolute bottom-0 w-full h-16 overflow-hidden pointer-events-none opacity-50">
<div class="absolute bottom-0 left-0 w-full h-px bg-gradient-to-r from-transparent via-primary/50 to-transparent box-shadow-[0_0_10px_var(--primary)]"></div>
<div class="flex items-end justify-center gap-1 h-full px-6 pb-0 opacity-40">
<div class="w-1 h-3 bg-primary/30 rounded-t-full"></div>
<div class="w-1 h-5 bg-primary/40 rounded-t-full"></div>
<div class="w-1 h-8 bg-primary/20 rounded-t-full"></div>
<div class="w-1 h-4 bg-primary/50 rounded-t-full"></div>
<div class="w-1 h-6 bg-primary/30 rounded-t-full"></div>
<div class="w-1 h-10 bg-primary/60 rounded-t-full"></div>
<div class="w-1 h-4 bg-primary/20 rounded-t-full"></div>
<div class="w-1 h-7 bg-primary/40 rounded-t-full"></div>
<div class="w-1 h-2 bg-primary/30 rounded-t-full"></div>
</div>
</div>
</div>
<style>
        @keyframes shimmer {
            100% {
                transform: translateX(100%);
            }
        }
    </style>

</body></html>
