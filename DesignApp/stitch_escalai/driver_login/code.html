<!DOCTYPE html>
<html class="dark" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login do Motorista</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ffe600","background-light": "#f8f8f5",
                        "background-dark": "#1a202c",
                        "surface-dark": "#2d3238", 
                        "blue-accent": "#2d3277","tech-blue": "#00a1f1",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "0.75rem", "xl": "1rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-dark font-display antialiased h-screen w-full overflow-hidden flex flex-col items-center justify-center relative">
<div class="absolute inset-0 z-0 opacity-10 pointer-events-none" style="background-image: radial-gradient(#ffe600 1px, transparent 1px); background-size: 32px 32px;"></div>
<div class="absolute top-0 left-0 right-0 h-64 bg-gradient-to-b from-blue-accent/30 to-transparent pointer-events-none z-0"></div>
<div class="absolute top-20 right-0 w-32 h-[1px] bg-gradient-to-l from-primary/50 to-transparent"></div>
<div class="absolute top-24 right-0 w-16 h-[1px] bg-gradient-to-l from-primary/30 to-transparent"></div>
<div class="absolute bottom-10 left-0 w-32 h-[1px] bg-gradient-to-r from-blue-accent/50 to-transparent"></div>
<main class="relative z-10 w-full max-w-md h-full flex flex-col p-6 justify-between">
<div class="flex flex-col items-center pt-12 space-y-6">
<div class="relative flex items-center justify-center w-24 h-24 rounded-2xl bg-gradient-to-br from-primary to-yellow-500 shadow-[0_0_20px_rgba(255,230,0,0.3)] mb-2 transform rotate-3 hover:rotate-0 transition-transform duration-500">
<div class="bg-surface-dark absolute inset-1 rounded-xl flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-5xl">handshake</span>
</div>
</div>
<div class="text-center space-y-2">
<h1 class="text-3xl font-bold tracking-tight text-white">
                    Login do Motorista
                </h1>
<p class="text-slate-400 text-sm font-medium uppercase tracking-widest">
                    Acesso ao Portal
                </p>
</div>
</div>
<div class="w-full flex-1 flex flex-col justify-center gap-6 py-8">
<div class="group">
<label class="block text-sm font-semibold text-slate-300 mb-2 ml-1" for="username">
                    Usuário ou E-mail
                </label>
<div class="relative flex items-center">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined">person</span>
</div>
<input class="block w-full pl-12 pr-4 py-4 bg-surface-dark/80 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all shadow-sm backdrop-blur-sm" id="username" placeholder="Seu usuário" type="text"/>
</div>
</div>
<div class="group">
<label class="block text-sm font-semibold text-slate-300 mb-2 ml-1" for="password">
                    Senha
                </label>
<div class="relative flex items-center">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined">lock</span>
</div>
<input class="block w-full pl-12 pr-12 py-4 bg-surface-dark/80 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all shadow-sm backdrop-blur-sm" id="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-200 cursor-pointer" type="button">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
<div class="flex justify-end mt-3">
<a class="text-sm font-medium text-slate-400 hover:text-primary transition-colors" href="#">
                        Esqueci minha senha
                    </a>
</div>
</div>
<button class="w-full flex items-center justify-center gap-2 py-2 text-slate-500 hover:text-white transition-colors">
<span class="material-symbols-outlined text-2xl">fingerprint</span>
<span class="text-sm font-medium">Entrar com biometria</span>
</button>
<div class="space-y-4 pt-2">
<button class="w-full bg-blue-accent hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-lg shadow-lg hover:shadow-blue-accent/30 transform hover:-translate-y-0.5 transition-all duration-200 flex items-center justify-center gap-2 border border-blue-600/50">
<span>ENTRAR</span>
<span class="material-symbols-outlined text-xl font-bold">login</span>
</button>
<button class="w-full bg-transparent border border-slate-600 text-slate-300 font-semibold py-4 px-6 rounded-lg hover:bg-slate-800 transition-colors">
                    Criar conta
                </button>
</div>
</div>
<div class="pb-8 text-center">
<p class="text-xs text-slate-500">
                Precisa de ajuda? <a class="font-bold text-slate-300 underline decoration-primary decoration-2 underline-offset-2" href="#">Suporte</a>
</p>
</div>
</main>

</body></html>
