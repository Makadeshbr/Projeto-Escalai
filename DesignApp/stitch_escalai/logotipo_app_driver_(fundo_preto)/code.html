<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ML Driver Splash Screen</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Orbitron:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ffe600", // Mercado Livre Yellow (Corrected Hex)
                        "primary-glow": "#ffe60080", // Semi-transparent yellow for glow
                        "secondary": "#2d3277", // Deep Blue accent
                        "background-dark": "#000000", // Strict black
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"],
                        "tech": ["Orbitron", "sans-serif"]
                    },
                    boxShadow: {
                        "neon": "0 0 10px #ffe600, 0 0 20px #ffe60040",
                        "neon-text": "0 0 5px rgba(255, 230, 0, 0.5)"
                    },
                    backgroundImage: {
                        'grid-pattern': "linear-gradient(to right, #1f1f1f 1px, transparent 1px), linear-gradient(to bottom, #1f1f1f 1px, transparent 1px)",
                        'cyber-gradient': "linear-gradient(135deg, rgba(45, 50, 119, 0.2) 0%, rgba(0,0,0,0) 100%)"
                    }
                },
            },
        }
    </script>
<style>
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(255, 230, 0, 0.2); }
            50% { box-shadow: 0 0 30px rgba(255, 230, 0, 0.5); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }.speed-shape {
            clip-path: polygon(20% 0%, 100% 0, 80% 100%, 0% 100%);
        }
        .arrow-shape {
            clip-path: polygon(75% 0%, 100% 50%, 75% 100%, 0% 100%, 25% 50%, 0% 0%);
        }
    </style>
<style>
        body {
          min-height: max(884px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-dark font-display antialiased min-h-screen flex items-center justify-center overflow-hidden relative selection:bg-primary selection:text-secondary">
<div class="absolute inset-0 z-0 bg-grid-pattern bg-[length:30px_30px] opacity-10 pointer-events-none"></div>
<div class="absolute inset-0 z-0 bg-[radial-gradient(circle_at_50%_30%,_rgba(45,50,119,0.15),_transparent_70%)] pointer-events-none"></div>
<div class="absolute top-0 left-0 w-32 h-32 bg-gradient-to-br from-secondary/20 to-transparent blur-3xl pointer-events-none"></div>
<div class="absolute bottom-0 right-0 w-64 h-64 bg-gradient-to-tl from-primary/10 to-transparent blur-3xl pointer-events-none"></div>
<main class="relative z-10 w-full max-w-md px-6 flex flex-col items-center justify-between h-screen py-12 md:h-auto md:py-20">
<div class="flex-1 md:hidden"></div>
<div class="flex flex-col items-center gap-10 w-full animate-float">
<div class="relative group">
<div class="absolute -inset-8 bg-primary/20 rounded-full blur-2xl opacity-40 group-hover:opacity-60 transition duration-700"></div>
<div class="relative w-40 h-40 flex items-center justify-center">
<div class="absolute inset-0 border border-gray-800 rounded-full"></div>
<div class="absolute inset-2 border border-gray-800/50 rounded-full border-dashed animate-[spin_10s_linear_infinite]"></div>
<div class="relative z-10 w-24 h-24 flex items-center justify-center transform -skew-x-12">
<div class="absolute right-0 top-1/2 -translate-y-1/2 w-16 h-12 bg-primary shadow-neon arrow-shape z-20"></div>
<div class="absolute left-2 top-1/2 -translate-y-1/2 w-16 h-8 bg-secondary speed-shape opacity-90 z-10"></div>
<div class="absolute -left-4 top-2 w-8 h-1 bg-white/20 rounded-full"></div>
<div class="absolute -left-8 bottom-3 w-12 h-1 bg-white/10 rounded-full"></div>
</div>
<div class="absolute -right-2 top-10 w-2 h-2 bg-primary rounded-full shadow-[0_0_8px_#ffe600]"></div>
</div>
</div>
<div class="text-center space-y-1 relative z-20">
<h1 class="font-tech text-6xl font-black tracking-tighter text-white drop-shadow-xl italic">
                    ML<span class="text-primary drop-shadow-[0_0_10px_rgba(255,230,0,0.6)]">Driver</span>
</h1>
<div class="flex items-center justify-center gap-4 mt-3 opacity-80">
<div class="h-[1px] w-12 bg-gradient-to-r from-transparent via-primary to-transparent"></div>
<p class="text-gray-300 text-xs font-mono tracking-[0.3em] uppercase">Logistics Core</p>
<div class="h-[1px] w-12 bg-gradient-to-r from-transparent via-primary to-transparent"></div>
</div>
</div>
</div>
<div class="flex flex-col items-center gap-8 w-full mt-16 flex-1 md:flex-none justify-end">
<div class="w-full max-w-[240px] relative">
<div class="flex justify-between text-[10px] font-mono text-primary mb-2">
<span class="animate-pulse">SYSTEM CHECK</span>
<span>OK</span>
</div>
<div class="h-1.5 w-full bg-gray-900 rounded-full overflow-hidden border border-gray-800 relative">
<div class="absolute inset-y-0 left-0 bg-primary w-[84%] shadow-[0_0_15px_#ffe600] rounded-r-full"></div>
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/30 to-transparent w-full -translate-x-full animate-[shimmer_2s_infinite]"></div>
</div>
<div class="flex justify-between text-[9px] font-mono text-gray-600 mt-2">
<span>ID: 8492-X</span>
<span>SYNCING...</span>
</div>
</div>
<div class="flex flex-col items-center gap-1">
<span class="material-symbols-outlined text-gray-800 text-2xl">fingerprint</span>
<p class="text-[10px] text-gray-700 font-mono">SECURE CONNECTION ESTABLISHED</p>
</div>
</div>
</main>
<style>
        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }
    </style>

</body></html>
